# discord-gateway — reference configuration.
# Deploy from gizen with wrangler, like dots-kick-events. No custom domain
# or workers.dev route is configured yet (workers_dev stays off).
name = "discord-gateway"
main = "worker.js"
compatibility_date = "2025-11-01"
workers_dev = false

[[durable_objects.bindings]]
name = "GATEWAY"
class_name = "Gateway"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Gateway"]

# Secrets (set with `wrangler secret put` — never write values here):
#   DISCORD_BOT_TOKEN           croissand's Discord bot token
#   DISCORD_BOT_TOKEN_ICHICHIME ichihime's Discord bot token
#                               (set only when enabling ichihime)
#   CLAUDE_HOOK_SECRET          whsec_ HMAC secret shared with dots-events'
#                               POST /claude-hook receiver (croissand)
#   EVENTS_TRIGGER_KEY          Bearer key for dots-events' POST /trigger
#                               (ichihime; set only when enabling her)
#   DISCORD_BOT_TOKEN_TAKO      tako's Discord bot token
#                               (set only when enabling tako)
#   TAKO_WEBHOOK_URL            HTTPS URL of tako's Grok Bot webhook
#   TAKO_WEBHOOK_KEY            credential sent with tako's webhook POST
#   TAKO_WEBHOOK_AUTH_HEADER    optional header name for TAKO_WEBHOOK_KEY
#                               (default Authorization: Bearer <key>;
#                               any other name sends the raw key)
#   ADMIN_KEY                   admin key for POST /connect, /send, /avatar
#
# Vars:
#   FORWARD_MODE        legacy fallback for bot-less attemptForward calls;
#                       per-bot forward modes are fixed in worker.js now.
#
# Endpoints (once routed/deployed):
#   GET  /status   public: {"connected", "ready"} for croissand plus a
#                  per-bot "bots" detail (connected/ready/configured),
#                  including bots.tako
#   POST /connect  admin key: nudge the Durable Object to (re)connect
#                  (optional {"bot": "ichihime"} or {"bot": "tako"}
#                  targets one bot)
#   POST /send     admin key: post a message to a Discord channel
#                  (optional {"bot": "ichihime"} or {"bot": "tako"}
#                  picks the sender)
